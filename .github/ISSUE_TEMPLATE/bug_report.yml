name: Bug report
description: Tell us what did not work and help us reproduce it.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run...
        2. Load...
        3. See...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.17.0"
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Command-line tool
        - Browser demo
        - Reddit integration
    validations:
      required: true
