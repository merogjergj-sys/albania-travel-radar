name: Feature request
description: Suggest a useful, responsible improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the user need before describing the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: responsible-use
    attributes:
      label: Responsible use
      options:
        - label: This feature does not require private data or automated unsolicited messages.
          required: true
